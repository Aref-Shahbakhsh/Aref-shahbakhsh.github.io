project:
  type: website
  output-dir: docs
  resources:
    - LICENSE.txt
    - _assets/images/favicon.svg
    - _assets/images/apple-touch-icon.png
    - _assets/documents/*

website:
  title: "Aref Shahbakhsh"
  description: "M.Sc. in Computer Engineering (Computer Systems Architecture), Sharif University of Technology. Machine learning for computational biology."
  site-url: "https://aref-shahbakhsh.github.io"
  favicon: "_assets/images/favicon.svg"
  image: "_assets/images/Avatar.jpg"
  open-graph: true
  twitter-card: true
  page-navigation: false
  back-to-top-navigation: true
  bread-crumbs: false
  # NOTE: the old Google Analytics ID belonged to the template author and was removed.
  # To track your own visits, add:
  # google-analytics:
  #   tracking-id: "G-XXXXXXXXXX"
  #   anonymize-ip: true

  navbar:
    logo: "_assets/images/mri-logo.svg"   # replace this file with your own logo (same name), or change the path
    logo-alt: ""
    title: false
    pinned: true
    collapse-below: lg
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV

  page-footer:
    border: false
    left: |
      <div class="foot-col">
      <a class="foot-mark" href="/index.html" aria-label="Home"><img src="/_assets/images/mri-logo.svg" alt="Logo"></a>
      <span>Copyright 2026 @ Aref Shahbakhsh</span>
      <span>All rights reserved</span>
      <span><a href="/LICENSE.txt">License</a></span>
      <span>Powered by <a href="https://quarto.org/">Quarto</a></span>
      </div>
    center: |
      <div class="foot-col">
      <strong>Contact</strong>
      <span>Department of Computer Engineering</span>
      <span>Sharif University of Technology</span>
      <span><a href="mailto:aref.shahbakhsh@sharif.edu">aref.shahbakhsh@sharif.edu</a></span>
      </div>
    right: |
      <div class="foot-col">
      <strong>Connect</strong>
      <div class="foot-links">
      <a href="mailto:aref.shahbakhsh@sharif.edu"><i class="bi bi-envelope"></i>Email</a>
      <a href="https://github.com/Aref-Shahbakhsh"><i class="bi bi-github"></i>GitHub</a>
      <a href="https://www.linkedin.com/in/Aref-Shahbakhsh"><i class="bi bi-linkedin"></i>LinkedIn</a>
      <a href="https://scholar.google.com/citations?user=8554euoAAAAJ&hl=en&oi=ao"><i class="bi bi-mortarboard"></i>Google Scholar</a>
      <a href="https://www.youtube.com/@Aref_Piano"><i class="bi bi-youtube"></i>Piano channel</a>
      </div>
      </div>

execute:
  freeze: auto

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    anchor-sections: false
    link-external-icon: false
    link-external-newwindow: true
    code-copy: true
    highlight-style: github
    include-in-header: _includes/head.html
    include-after-body: [_includes/site-scripts.html, _includes/share.html]
